<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiele</title>
<!-- App-Icon „Akten & Action“ (Startbildschirm, Browser-Tab) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">   <!-- weiß wie der Logo-Balken (MZ, 22.10.2026); die Spiele behalten #91a534 -->
<meta name="apple-mobile-web-app-title" content="Akten & Action">
<style>
  /* Startseite „Akten & Action“ – Layout B „Schreibtisch“ (MZ, 20.10.2026):
     Eichen-Tischplatte als Hintergrund, Logo als eigenes weißes Schild (Logo steht immer für sich, MZ 20.10.2026),
     darunter ein weißes Kärtchen mit Sammlungsname und Gesamt-Bestwert, mit viel Abstand darunter die Spiele
     als gemalte Akten (Deckel in Kundenfarbe umgefärbt), unten der Spruch der Kanzlei. Farben aus kunde/kunde.js. */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; overscroll-behavior: none; }
  html, body { overflow-x: clip; }   /* Schattenrand der Waage nicht seitlich scrollbar machen */
  body {
    background: #b98a55 url("bilder/schreibtisch.webp") center / cover fixed;
    color: var(--blaugrau); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 22px 14px 18px;
    min-height: 100vh; min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  /* Hochformat (MZ, 22.10.2026): unter dem Band (Gummiband beim Weiterwischen, Handyleiste) Kundenfarbe statt Holz.
     html bekommt eine eigene Farbe, damit das Holz nur noch am body liegt; die Fläche außerhalb des body (Overscroll)
     zeigt die html-Farbe. Oben Weiß wie der Logo-Balken, solange man im oberen Teil der Seite ist (Klasse .unten setzt das Skript). */
  @media (orientation: portrait) {
    html { background: #fff; }
    html.unten { background: var(--akzent); }
  }
  .oben { display: flex; flex-direction: column; align-items: center; }
  /* Logo (MZ, 22.10.2026): weißer Balken über die volle Breite, bündig am oberen Rand – Gegenstück zum Band unten.
     Nichts anderes im Balken (Logo steht für sich). Höhe über --logo-h und --balken-pad, damit der Ton-Knopf mittig sitzt. */
  :root { --logo-h: 62px; --balken-pad: 11px; }
  .logobalken {
    align-self: stretch; margin: -22px -14px 0; padding: calc(var(--balken-pad) + env(safe-area-inset-top)) 18px var(--balken-pad);
    background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25); display: flex; justify-content: center;
    position: relative; z-index: 2;
  }
  .logo { height: var(--logo-h); width: auto; max-width: 100%; display: block; }
  /* Querformat/Desktop: Logo etwas größer; flache Fenster siehe unten */
  @media (orientation: landscape) and (min-width: 700px) and (min-height: 521px) { :root { --logo-h: 80px; --balken-pad: 13px; } }
  /* Sammlungsname und Gesamt-Bestwert: eigenes Kärtchen, leicht schräg */
  /* .kopf = Lage (Platz, Drehung, Größe), .karte = das weiße Kärtchen selbst (wird animiert, MZ 22.10.2026) */
  .kopf { margin: 26px 0 0; transform: rotate(-1.5deg); position: relative; }
  .kopf .karte {
    position: relative; padding: 12px 26px 13px; border-radius: 12px; background: #fff; text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    transition: transform .45s cubic-bezier(.3,1.7,.5,1), box-shadow .3s ease-out;
  }
  /* Darüberfahren: hebt sich deutlich an (größerer Schatten), kippt weiter und federt dabei nach */
  @media (hover: hover) {
    .kopf .karte:hover { transform: translateY(-7px) rotate(3deg) scale(1.04); box-shadow: 0 20px 34px rgba(0,0,0,.38), 0 4px 8px rgba(0,0,0,.18); }
  }
  /* Staubwolke/Schattenpuls beim Aufprall (Skript spielt die Animation ab) */
  .kopf .staub {
    position: absolute; left: -15%; right: -15%; top: 25%; bottom: -30%; pointer-events: none; opacity: 0; z-index: -1;
    background: radial-gradient(ellipse at 50% 55%, rgba(70,45,20,.45), rgba(70,45,20,.18) 45%, rgba(70,45,20,0) 70%);
  }
  h1 { margin: 0; font-size: clamp(28px, 8.5vw, 40px); line-height: 1.05; font-weight: 900; letter-spacing: .3px; color: var(--titel-farbe, var(--blaugrau)); }   /* Markenfarbe wie „Frist-Alarm“ (MZ, 22.10.2026) */
  .unter { margin: 5px 0 0; font-size: clamp(13px, 3.8vw, 16px); font-weight: 700; color: #1c252b; }   /* Gesamt-Bestwert sehr dunkel (MZ, 22.10.2026) */
  .unter:empty { display: none; }
  /* Spiele als Akten: hochkant zwei nebeneinander, die dritte mittig darunter; quer drei nebeneinander */
  .spiele {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 22px 18px;
    width: 100%; max-width: 760px; margin: clamp(40px, 7vh, 90px) 0 0;   /* deutlich Abstand zum Kärtchen (MZ) */
    position: relative;
  }
  /* Messing-Waage (MZ, 22.10.2026): steht frei auf dem Tisch neben den Akten, Lage und Größe setzt das Skript */
  .waage { position: absolute; display: none; pointer-events: none; -webkit-tap-highlight-color: transparent; animation: einblendenW .6s .9s ease-out both; }
  @keyframes einblendenW { from { opacity: 0; } }
  .spiel {
    position: relative; display: block; width: min(36vw, 200px, 25vh); aspect-ratio: 484 / 720; container-type: inline-size;
    background: var(--akte) center / 100% 100% no-repeat; color: var(--haupt-text); text-decoration: none;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,.35)); transition: transform .2s ease-out, filter .2s ease-out;
  }
  @media (orientation: landscape) and (min-width: 560px) { .spiel { width: min(26vw, 210px, 25.5vh); } }   /* niedrige Fenster: etwas kleiner, Luft zum Kontakt-Band */
  .spiel:nth-child(1) { --dreh: -4deg; }
  .spiel:nth-child(2) { --dreh: 3deg; }
  .spiel:nth-child(3) { --dreh: 2deg; }
  .spiel { transform: rotate(var(--dreh)); }
  .spiel:hover, .spiel:focus-visible { transform: rotate(var(--dreh)) translateY(-5px) scale(1.03); outline: none; filter: drop-shadow(0 18px 18px rgba(0,0,0,.4)); }
  .spiel:active { transform: rotate(var(--dreh)) scale(.98); }
  /* Inhalt nur auf dem Deckel (rechts ragen ~6% Blätter heraus) */
  .deckel {
    position: absolute; left: 0; top: 0; bottom: 0; width: 94%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12%; padding: 10% 8%;
    text-align: center;
  }
  .name { margin: 0; font-size: 11.5cqw; font-weight: 900; line-height: 1.1; }
  /* Spielnamen auf allen Akten weiß mit dezentem Schatten (MZ, 22.10.2026), auch auf der grauen */
  .spiel .name { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5), 0 0 1px rgba(0,0,0,.35); }
  /* Unterzeile unter dem Spielnamen (MZ, 22.10.2026): kurz, was man tut – weiß auf Grün, klein */
  .titelblock { display: block; }
  .zweck { display: block; margin: .45em 0 0; font-size: max(10px, 6.6cqw); font-weight: 700; line-height: 1.2; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 0 1px rgba(0,0,0,.35); }
  .etikett {
    margin: 0; width: 100%; padding: 7px 6px; border-radius: 5px; background: #fbfaf6; color: var(--blaugrau);
    font-size: max(10.5px, 7cqw); font-weight: 700; line-height: 1.3; box-shadow: 0 2px 4px rgba(0,0,0,.2);
  }
  .etikett b { display: block; font-size: 1.35em; font-weight: 900; color: #1c252b; }
  .etikett .levelzeile { display: block; margin-top: 2px; font-size: .9em; font-weight: 700; opacity: .75; }
  /* Spiel noch in Arbeit: nur grau, nicht antippbar, ohne Hinweistext (kein „demnächst“, MZ 21.10.2026) */
  .spiel.bald { filter: grayscale(1) brightness(1.05) contrast(.85) drop-shadow(0 8px 10px rgba(0,0,0,.3)); cursor: default; pointer-events: none; }
  .spiel.bald .name { opacity: .9; }
  .spiele { margin-bottom: 26px; }   /* Abstand zum Band unten */
  /* Band unten in der hellen Logofarbe (akzent aus kunde.js) mit Kontakt der Kanzlei (MZ, 22.10.2026); Daten aus kunde.js */
  .fuss {
    margin: auto -14px -18px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); align-self: stretch;
    background: var(--akzent); color: #fff; box-shadow: 0 -4px 14px rgba(0,0,0,.25);
    /* Texte im Band ohne Effekte (MZ, 22.10.2026): kein Schatten, nicht kursiv, nur fett */
    display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 13.5px; line-height: 1.45; position: relative; z-index: 1;
  }
  .spruch { margin: 0; white-space: nowrap; font-size: 15px; font-weight: 800; font-style: normal; color: #fff; text-align: center; }
  .spruch:empty { display: none; }
  /* Impressum und Datenschutz (MZ, 22.10.2026): klein unter dem Spruch, in der Schriftfarbe der Fläche – die einzigen Links im Band */
  .rechtliches { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; font-style: normal; }
  .rechtliches a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.55); text-underline-offset: 2px; }
  .rechtliches a:hover, .rechtliches a:focus-visible { text-decoration-color: currentColor; }
  .rechtliches a + a { margin-left: 14px; }
  /* Band dreigeteilt (MZ, 22.10.2026): Kanzleiname und Spruch in Weiß auf hellem Grün (wie bisher), die Adressen in der
     Mitte auf einer weißen Fläche (volle Bandhöhe, gerade Kanten) in hellem Grün ohne Schatten. Hochformat: Adressbereich unten weiß. */
  .kontakt { display: flex; flex-direction: column; gap: 10px; width: auto; align-self: stretch;
    margin: 0 -18px calc(-14px - env(safe-area-inset-bottom)); padding: 12px 18px calc(14px + env(safe-area-inset-bottom));
    background: #fff; color: var(--akzent); text-shadow: none; }
  .standort { text-align: center; }
  .standort b { display: block; font-size: 14px; font-weight: 800; }
  .standort p { margin: 0; }
  @media (orientation: landscape) and (min-width: 700px) {
    .fuss { flex-direction: row; justify-content: center; gap: 36px; padding: 8px 24px; line-height: 1.3; }
    .spiele { margin-bottom: 30px; }   /* mind. 20 px zum Band (gedrehte Akten), auch wenn die Seite scrollt */
    .kontakt { flex-direction: row; justify-content: center; gap: 40px; width: auto; align-self: stretch; margin: -8px 0; padding: 8px 40px; }
    .standort { text-align: left; }
    /* Kanzleiname links, Spruch rechts, vertikal mittig (MZ, 22.10.2026) – als eigene Spalten neben dem Adressbereich
       (statt darübergelegt), damit sie nie unter der weißen Mitte verschwinden; bei wenig Platz brechen sie um */
    .spruch { flex: 1 1 0; min-width: 0; white-space: normal; font-size: 16px; }
    .spruch.kanzlei { order: 0; text-align: left; }
    .kontakt { order: 1; flex: 0 0 auto; }
    .spruch.spruchtext { order: 2; text-align: right; }
  }
  /* schmales Querformat: Kanzleiname links und Spruch rechts in einer Zeile über den Adressen (sonst überlappen sie) */
  @media (orientation: landscape) and (min-width: 700px) and (max-width: 1179px) {
    .fuss { flex-wrap: wrap; row-gap: 4px; }
    .spruch { position: static; transform: none; flex: 1 1 40%; }
    .spruch.kanzlei { text-align: left; order: 0; }
    .spruch.spruchtext { text-align: right; order: 1; }
    .kontakt { order: 2; flex: 0 0 calc(100% + 48px); margin: 0 -24px -8px; padding: 5px 24px 7px; }
  }
  #tonKnopf {
    /* liegt über dem weißen Logo-Balken, senkrecht mittig darin; Fläche in Blaugrau, damit er auf Weiß und Holz lesbar ist */
    position: fixed; top: calc(env(safe-area-inset-top) + var(--balken-pad) + (var(--logo-h) - 40px) / 2); right: 10px;
    width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; z-index: 5;
    background: var(--blaugrau); color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: pointer; display: grid; place-items: center;
  }
  #tonKnopf svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* Niedrige Hochformate (z. B. 320×640): Logo und Akten etwas kleiner, damit alle drei Akten sichtbar bleiben */
  @media (orientation: portrait) and (max-height: 700px) {
    :root { --logo-h: 52px; --balken-pad: 9px; }
    .kopf { margin-top: 20px; }
    .spiele { margin-top: 32px; }
    .spiel { width: min(34vw, 22vh); }
  }
  /* Flache Fenster (eingebettet, Handy quer): alles enger */
  @media (max-height: 520px) {
    body { padding-top: 12px; }
    :root { --logo-h: 44px; --balken-pad: 7px; }
    .logobalken { margin-top: -12px; }
    .kopf { margin-top: 14px; }
    .kopf .karte { padding: 8px 20px; }
    h1 { font-size: 26px; }
    .spiele { margin-top: 30px; }
    .spiel { width: min(20vw, 140px, 44vh); }
    .fuss { padding-top: 8px; padding-bottom: 8px; font-size: 13px; line-height: 1.3; }
  }
  /* flach und quer: Logo-Balken oben, Kärtchen darunter (MZ, 22.10.2026) */
  @media (max-height: 520px) and (orientation: landscape) {
    .spiele { margin-bottom: 26px; }   /* mind. 20 px Abstand zum Band (MZ, 22.10.2026) */
  }

  /* ---------- Animationen (sanft, MZ 22.10.2026): gestaffelt in ca. 1,6s – Logo-Balken gleitet von oben herein, Kärtchen (wie hingeworfen, dreht
     sich auf seine Lage), Akten nacheinander von unten, Waage (blendet ein, pendelt einmal ein), Band gleitet von unten herein.
     Eigene Eigenschaften translate/rotate/scale wirken zusätzlich zu transform – so stören sie weder die vom Skript gesetzte
     Lage des Kärtchens noch das Anheben beim Darüberfahren. ---------- */
  @keyframes rein { from { opacity: 0; translate: 0 -16px; } }
  @keyframes ablegen { from { opacity: 0; translate: 0 44px; rotate: calc(var(--dreh) * 2); } }
  @keyframes fussRein { from { opacity: 0; translate: 0 100%; } }
  @keyframes balkenRein { from { opacity: 0; translate: 0 -100%; } }   /* Gegenstück zum Band unten */
  .logobalken { animation: balkenRein .6s .05s cubic-bezier(.2,.8,.3,1) both; }
  /* Kärtchen: Auftritt, Wackler und Antippen macht das Skript (Web Animations), siehe kopfAnimieren() */
  .fuss { animation: fussRein .6s 1s cubic-bezier(.2,.8,.3,1) both; }
  /* liegt auf der Stempeluhr-Akte (Querformat): über den Akten, Schatten fällt auf die Akte */
  .kopf.liegt { position: relative; z-index: 3; }
  /* hohes Querformat: früher -40px wegen des großen Logo-Schilds, mit dem flacheren Logo-Balken (MZ, 22.10.2026) nicht mehr
     nötig. Flaches Querformat: das Kärtchen steht jetzt unter dem Balken statt daneben – es gibt Platz im Fluss frei,
     damit die Akten so weit oben bleiben wie bisher */
  @media (orientation: landscape) and (min-width: 700px) and (max-height: 520px) { .kopf.liegt { margin-bottom: -44px; } }
  .kopf.liegt .karte { box-shadow: 0 10px 22px rgba(0,0,0,.35), 0 2px 5px rgba(0,0,0,.2); }
  /* Querformat/Desktop (MZ, 22.10.2026): Kärtchen nach rechts versetzt (Richtung rechte Akte) und andersherum gekippt –
     wirkt locker hingeworfen. Hochformat bleibt unverändert. */
  @media (orientation: landscape) and (min-width: 700px) {
    .kopf { --dreh: 8deg; transform: translate(var(--rechts, min(230px, 16vw)), var(--runter, 0px)) rotate(8deg); }
  }
  @media (orientation: landscape) and (min-width: 700px) and (max-height: 520px) {
    .kopf { --rechts: 36px; --runter: 8px; }   /* flach: unter dem Logo-Balken, leicht nach rechts versetzt */
  }
  .spiel { animation: ablegen .65s cubic-bezier(.2,.8,.3,1.04) both; }
  .spiel:nth-child(1) { animation-delay: .55s; }
  .spiel:nth-child(2) { animation-delay: .7s; }
  .spiel:nth-child(3) { animation-delay: .85s; }
  #tonKnopf { transition: transform .15s, background-color .15s; }
  #tonKnopf:hover { transform: scale(1.1); background: var(--dunkel); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="logobalken"><img class="logo" alt=""></div>
<div class="oben">
  <header class="kopf">
    <span class="staub" aria-hidden="true"></span>
    <div class="karte">
      <h1 class="titel"></h1>
      <p class="unter"></p>
    </div>
  </header>
</div>

<nav class="spiele">
  <a class="spiel" href="anwalt-frist-alarm/" data-id="frist-alarm" data-level="frist-alarm frist-alarm-2 frist-alarm-3">
    <span class="deckel">
      <span class="titelblock"><p class="name">Frist-Alarm</p><span class="zweck">Akten nach Frist sortieren</span></span>
      <p class="etikett best"></p>
    </span>
  </a>
  <a class="spiel" href="anwalt-einspruch/" data-id="einspruch" data-level="einspruch einspruch-2 einspruch-3">
    <span class="deckel">
      <span class="titelblock"><p class="name">Einspruch!</p><span class="zweck">Widerspruch erheben</span></span>
      <p class="etikett best"></p>
    </span>
  </a>
  <!-- Spiele in Vorbereitung: Klasse „bald“, kein href – nur grau, nicht antippbar, ohne Hinweistext -->
  <a class="spiel" href="anwalt-stempeluhr/" data-id="stempeluhr" data-level="stempeluhr stempeluhr-2 stempeluhr-3">
    <span class="deckel">
      <span class="titelblock"><p class="name">Stempeluhr</p><span class="zweck">Arbeitszeit einhalten</span></span>
      <p class="etikett best"></p>
    </span>
  </a>
</nav>

<footer class="fuss">
  <p class="spruch kanzlei"></p>
  <p class="spruch spruchtext"></p>
  <div class="kontakt"></div>
</footer>
<button id="tonKnopf" type="button" aria-label="Ton an oder aus"></button>

<script src="kunde/kunde.js"></script>
<script>
  // Farben, Logo und Texte aus kunde/kunde.js übernehmen; Bestwerte aus den Spielen anzeigen
  (function () {
    'use strict';
    const K = window.KUNDE || {}, F = Object.assign({ haupt: '#d32f2f', akzent: '#ffb300', dunkel: '#151922', hell: '#ffffff', blaugrau: '#475e6c' }, K.farben);
    const s = document.documentElement.style;
    const n = parseInt(F.haupt.replace('#', ''), 16), hell = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) > 150;
    s.setProperty('--haupt', F.haupt); s.setProperty('--haupt-text', F.hauptText || (hell ? '#111' : '#fff'));
    s.setProperty('--blaugrau', F.blaugrau);
    s.setProperty('--akzent', F.akzent); s.setProperty('--dunkel', F.dunkel);   // Band unten (Kontakt)
    // Hochformat: Rand außerhalb der Seite unten in Kundenfarbe, oben Holz (CSS html.unten). Ab der Seitenmitte gilt „unten“;
    // passt die Seite ganz aufs Display, ebenfalls – nur beim Ziehen über den oberen Rand (scrollY < 0, iOS) wieder Holz.
    {
      const wurzel = document.documentElement;
      const randFarbe = () => {
        const y = scrollY, max = Math.max(0, wurzel.scrollHeight - innerHeight);
        wurzel.classList.toggle('unten', y >= 0 && y >= max / 2);
      };
      randFarbe();
      addEventListener('scroll', randFarbe, { passive: true });
      addEventListener('resize', randFarbe);
      // Seitenhöhe ändert sich nach dem Laden und solange das Band von unten hereingleitet
      if (window.ResizeObserver) new ResizeObserver(randFarbe).observe(document.body);
      addEventListener('load', randFarbe);
      document.addEventListener('animationend', randFarbe);
    }
    // Titelfarbe wie im Rahmen (rahmen.js, Zettel-Stil): farben.titel aus kunde.js, sonst die Markenfarbe so weit
    // abgedunkelt, dass sie auf hellem Papier (#f7efd6) mindestens 3,2:1 Kontrast hat – ergibt dieselbe Farbe wie „Frist-Alarm“
    {
      const rgb = h => { const x = parseInt(h.replace('#', ''), 16); return [x >> 16 & 255, x >> 8 & 255, x & 255]; };
      const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
      const papier = lum('#f7efd6');
      let titel = F.titel || F.haupt;
      if (!F.titel) for (let f = 0; f <= 0.8 && (papier + 0.05) / (lum(titel) + 0.05) < 3.2; f += 0.04)
        titel = '#' + rgb(F.haupt).map(v => Math.round(v * (1 - f)).toString(16).padStart(2, '0')).join('');
      s.setProperty('--titel-farbe', titel);
    }
    const T = K.texte || {};
    const logo = document.querySelector('.logo');
    logo.src = K.logoAufHell || K.logo || 'kunde/logo.png';
    logo.alt = K.firma || '';
    document.querySelector('.titel').textContent = T.titel || 'Spiele';
    document.querySelector('.spruchtext').textContent = K.spruch || '';
    // Impressum/Datenschutz unter dem Spruch (Adressen aus kunde.js, neuer Tab)
    if ((K.rechtliches || []).length) {
      const r = document.createElement('span'); r.className = 'rechtliches';
      K.rechtliches.forEach(l => { const a = document.createElement('a'); a.href = l.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = l.text; r.append(a); });
      document.querySelector('.spruchtext').append(r);
    }
    document.querySelector('.kanzlei').textContent = K.kanzlei || '';

        ac = new AC();
        fetch(MUSIK.datei).then(r => r.arrayBuffer()).then(b => new Promise((ok, nein) => ac.decodeAudioData(b, ok, nein)))
          .then(b => { puffer = zuschneiden(b); an(); }).catch(() => {});
      }
      if (ac.state !== 'running') ac.resume().then(() => { if (ac.state === 'running') an(); }).catch(() => {});
      if (!puffer || ac.state !== 'running') return;
      const q = ac.createBufferSource(), v = ac.createGain();
      q.buffer = puffer; q.loop = true;
      v.gain.setValueAtTime(0.0001, ac.currentTime);
      v.gain.exponentialRampToValueAtTime(MUSIK.pegel, ac.currentTime + 1.2);
      q.connect(v).connect(ac.destination);
      q.start();
      laeuft = { q, v };
    }
    function aus() {
      if (!laeuft) return;
      const { q, v } = laeuft;
      laeuft = null;
      try { v.gain.setTargetAtTime(0.0001, ac.currentTime, 0.15); q.stop(ac.currentTime + 1); } catch (e) { /* egal */ }
    }
    // Browser erlauben Ton erst nach dem ersten Tippen
    ['pointerup', 'touchend', 'keydown'].forEach(e => addEventListener(e, an, { passive: true }));
    knopf.addEventListener('click', () => {
      tonAn = !tonAn;
      try { localStorage.setItem('mg:ton', tonAn ? 'an' : 'aus'); } catch (e) { /* privat */ }
      symbol();
      if (tonAn) an(); else aus();
    });
  })();
</script>
